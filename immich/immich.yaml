apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: freenas-iscsi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: freenas-iscsi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: immich
data:
  root_password: ${IMMICH_POSTGRES_ROOT_PASSWORD_BASE64}
  database_url: ${IMMICH_DATABASE_URL_BASE64}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: immich
  labels:
    app: postgres
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Don't run on any other node running another db.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mysql
                        - mongodb
                        - postgres
                topologyKey: "kubernetes.io/hostname"
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        # TODO -- Watchdog container that kills for readonly filesystem
        - name: postgres
          image: registry.internal.aleemhaji.com/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /usr/local/pgsql/data
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: root_password
          volumeMounts:
            - name: postgres-persistent-storage
              mountPath: /usr/local/pgsql
      volumes:
        - name: postgres-persistent-storage
          persistentVolumeClaim:
            claimName: immich-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: immich
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      protocol: TCP
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: immich
  labels:
    app: valkey
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  serviceName: valkey
  template:
    metadata:
      name: valkey
      labels:
        app: valkey
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: valkey
          image: registry.internal.aleemhaji.com/valkey/valkey:8.1.5
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: immich
  labels:
    app: valkey
spec:
  ports:
    - port: 6379
      protocol: TCP
  type: NodePort
  selector:
    app: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: machine-learning
  namespace: immich
  labels:
    app: machine-learning
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning
  serviceName: machine-learning
  template:
    metadata:
      labels:
        app: machine-learning
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: machine-learning
          image: registry.internal.aleemhaji.com/immich-app/immich-machine-learning:v2.3.1
          volumeMounts:
            - name: model-cache-persistent-storage
              mountPath: /cache
      volumes:
        - name: model-cache-persistent-storage
          persistentVolumeClaim:
            claimName: immich-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: machine-learning
  namespace: immich
  labels:
    app: machine-learning
spec:
  ports:
    - port: 6379
      protocol: TCP
  type: NodePort
  selector:
    app: machine-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: immich
          image: registry.internal.aleemhaji.com/immich-app/immich-server:v2.3.1
          ports:
            - containerPort: 2283
          env:
            - name: IMMICH_PORT
              value: "2283"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: database_url
            - name: REDIS_HOSTNAME
              value: valkey-0.valkey.immich.svc.cluster.local
          volumeMounts:
            - name: immich-storage
              mountPath: /data
      volumes:
        - name: immich-storage
          nfs:
            server: 192.168.96.4
            path: /mnt/main/apps/immich
---
apiVersion: v1
kind: Service
metadata:
  name: immich
  namespace: immich
  labels:
    app: immich
spec:
  ports:
    - port: 2283
      protocol: TCP
  selector:
    app: immich
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-redirect
  namespace: immich
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://immich.internal.aleemhaji.com
spec:
  ingressClassName: nginx
  rules:
    - host: immich
    - host: immich.home
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - immich.internal.aleemhaji.com
      secretName: internal-certificate-files
  rules:
    - host: immich.internal.aleemhaji.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich
                port:
                  number: 2283
