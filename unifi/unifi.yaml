apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-controller
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: freenas-iscsi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi-controller
  labels:
    app: unifi
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: unifi
  serviceName: unifi-tcp
  template:
    metadata:
      labels:
        app: unifi
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: unifi
          image: registry.internal.aleemhaji.com/jacobalberty/unifi:v9.5.21
          ports:
            - containerPort: 8443
              protocol: TCP
              name: unifi-gui-port
            - containerPort: 8080
              protocol: TCP
              name: unspecified
            - containerPort: 3478
              protocol: UDP
              name: unifi-stun-port
            - containerPort: 10001
              protocol: UDP
              name: unifi-discovery
          resources:
            requests:
              memory: "1024Mi"
              cpu: "200m"
            limits:
              memory: "1024Mi"
              cpu: "200m"
          env:
            - name: UNIFI_SERVICE_IP
              value: ${LOAD_BALANCER_IP}
          volumeMounts:
            - name: unifi-controller-data
              mountPath: /usr/lib/unifi/data/
      volumes:
        - name: unifi-controller-data
          persistentVolumeClaim:
            claimName: unifi-controller
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-tcp
  labels:
    app: unifi
  annotations:
    metallb.universe.tf/allow-shared-ip: unifi
spec:
  # https://help.ubnt.com/hc/en-us/articles/218506997
  ports:
    - port: 8443
      protocol: TCP
      name: unifi-gui-port
    - port: 8080
      protocol: TCP
      name: unifi-comms-port
  type: LoadBalancer
  loadBalancerIP: ${LOAD_BALANCER_IP}
  selector:
    app: unifi
---
apiVersion: v1
kind: Service
metadata:
  name: unifi-udp
  labels:
    app: unifi
  annotations:
    metallb.universe.tf/allow-shared-ip: unifi
spec:
  # https://help.ubnt.com/hc/en-us/articles/218506997
  ports:
    - port: 3478
      protocol: UDP
      name: unifi-stun-port
    - port: 10001
      protocol: UDP
      name: unifi-discovery-port
  type: LoadBalancer
  loadBalancerIP: ${LOAD_BALANCER_IP}
  selector:
    app: unifi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi-redirect
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://unifi-controller.internal.aleemhaji.com
spec:
  ingressClassName: nginx
  rules:
    - host: unifi-controller
    - host: unifi-controller.home
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "https"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - unifi-controller.internal.aleemhaji.com
      secretName: internal-certificate-files
  rules:
    - host: unifi-controller.internal.aleemhaji.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unifi-tcp
                port:
                  number: 8443
