apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-create-${DATABASE_NAME}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-create
          image: postgres:9
          command:
            - sh
            - -c
            - |
              SELECT_QUERY="SELECT 1 FROM pg_database WHERE datname = '${DATABASE_NAME}';"
              CREATE_STATEMENT="CREATE DATABASE ${DATABASE_NAME};"
              if ! psql -h postgres --user postgres -t -c "$SELECT_QUERY" | grep -q 1; then
                psql -h postgres --user postgres -c "$CREATE_STATEMENT"
              else
                echo "Database \"${DATABASE_NAME}\" already exists; skipping creation"
              fi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: root_password
