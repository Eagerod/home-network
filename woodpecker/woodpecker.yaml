
apiVersion: v1
kind: ServiceAccount
metadata:
  name: woodpecker-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: woodpecker-agent
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - persistentvolumeclaims
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-agent
subjects:
  - kind: ServiceAccount
    name: woodpecker-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: woodpecker-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-server
  labels:
    app: woodpecker
    module: server
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: woodpecker
      module: server
  template:
    metadata:
      labels:
        app: woodpecker
        module: server
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: server
          image: registry.internal.aleemhaji.com/woodpeckerci/woodpecker-server:v3.19.0
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 9000
          env:
            - name: WOODPECKER_HOST
              value: https://woodpecker.internal.aleemhaji.com
            - name: WOODPECKER_ADMIN
              value: aleem
            - name: WOODPECKER_FORGEJO
              value: "true"
            - name: WOODPECKER_FORGEJO_URL
              value: https://forgejo.internal.aleemhaji.com
            - name: WOODPECKER_FORGEJO_CLIENT
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: forgejo_client_id
            - name: WOODPECKER_FORGEJO_SECRET
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: forgejo_client_secret
            - name: WOODPECKER_DATABASE_DRIVER
              value: postgres
            - name: WOODPECKER_DATABASE_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: connection_string
            - name: WOODPECKER_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: agent_secret
            - name: WOODPECKER_BACKEND_K8S_STORAGE_CLASS
              value: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-agent
  labels:
    app: woodpecker
    module: agent
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: woodpecker
      module: agent
  template:
    metadata:
      labels:
        app: woodpecker
        module: agent
    spec:
      serviceAccountName: woodpecker-agent
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: agent
          image: registry.internal.aleemhaji.com/woodpeckerci/woodpecker-agent:v3.19.0
          env:
            - name: WOODPECKER_SERVER
              value: woodpecker-server:9000
            - name: WOODPECKER_AGENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: woodpecker-secrets
                  key: agent_secret
            - name: WOODPECKER_BACKEND
              value: kubernetes
            - name: WOODPECKER_BACKEND_K8S_NAMESPACE
              value: default
---
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-server
  labels:
    app: woodpecker
    module: server
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9000
      targetPort: grpc
      protocol: TCP
  selector:
    app: woodpecker
    module: server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: woodpecker-redirect
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://woodpecker.internal.aleemhaji.com
spec:
  ingressClassName: nginx
  rules:
    - host: woodpecker
    - host: woodpecker.home
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: woodpecker
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - woodpecker.internal.aleemhaji.com
      secretName: internal-certificate-files
  rules:
    - host: woodpecker.internal.aleemhaji.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: woodpecker-server
                port:
                  number: 8000
