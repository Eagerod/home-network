apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  labels:
    app: miniflux
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: miniflux
          image: registry.internal.aleemhaji.com/miniflux/miniflux:2.2.11
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: connection_string
            - name: RUN_MIGRATIONS
              value: "1"
            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: admin_username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: admin_password
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  labels:
    app: miniflux
spec:
  ports:
    - port: 8080
      protocol: TCP
  selector:
    app: miniflux
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux-redirect
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://miniflux.internal.aleemhaji.com
spec:
  ingressClassName: nginx
  rules:
    - host: miniflux
    - host: miniflux.home
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - miniflux.internal.aleemhaji.com
      secretName: internal-certificate-files
  rules:
    - host: miniflux.internal.aleemhaji.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: miniflux
                port:
                  number: 8080
