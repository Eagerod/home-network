apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
spec:
  revisionHistoryLimit: 0
  replicas: 2
  selector:
    matchLabels:
      app: redis
  serviceName: redis
  template:
    metadata:
      name: redis
      labels:
        app: redis
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      initContainers:
        - name: redis-init
          image: registry.internal.aleemhaji.com/busybox:1.35.0
          command:
            - sh
            - -c
            - |
              set -ex
              CONFIG_DIR="/config/redis-$POD_ORDINAL"
              mkdir -p "$CONFIG_DIR"

              if [ "$POD_ORDINAL" -ne 0 ]; then
                echo "slaveof redis-0.redis 6379" >> "$CONFIG_DIR/redis.conf"
              else
                echo "cluster-enabled yes" >> "$CONFIG_DIR/redis.conf"
              fi
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: redis
          image: registry.internal.aleemhaji.com/redis:8.2.2
          ports:
            - containerPort: 6379
          command:
            - sh
            - -eufc
            - |
              CONFIG_DIR="/config/redis-$POD_ORDINAL"

              redis-server "$CONFIG_DIR/redis.conf"
          env:
            - name: POD_ORDINAL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          nfs:
            server: 192.168.96.4
            path: /mnt/main/apps/redis
