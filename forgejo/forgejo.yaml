apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app: forgejo
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      imagePullSecrets:
        - name: registry.internal.aleemhaji.com
      containers:
        - name: forgejo
          image: registry.internal.aleemhaji.com/forgejo/forgejo:16.0.5-rootless
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          ports:
            - containerPort: 3000
            - containerPort: 2222
          volumeMounts:
            - name: forgejo-persistent-storage
              mountPath: /var/lib/gitea
            - name: ssl-cert
              mountPath: /etc/forgejo/tls
          env:
            - name: FORGEJO__OAUTH2__JWT_SIGNING_ALGORITHM
              value: HS256
            - name: FORGEJO__SERVER__PROTOCOL
              value: https
            - name: FORGEJO__SERVER__CERT_FILE
              value: /etc/forgejo/tls/tls.crt
            - name: FORGEJO__SERVER__KEY_FILE
              value: /etc/forgejo/tls/tls.key
            - name: FORGEJO__SERVER__SSH_PORT
              value: "22"
            - name: FORGEJO__SERVER__SSH_LISTEN_PORT
              value: "2222"
            - name: FORGEJO__CACHE__ADAPTER
              value: redis
            - name: FORGEJO__CACHE__HOST
              value: redis://@redis-0.redis.default.svc.cluster.local:6379/0?pool_size=10&idle_timeout=300s
            - name: FORGEJO__CACHE__ITEM_TTL
              value: "72h"
            - name: FORGEJO__ACTIONS__ENABLED
              value: "false"
      volumes:
        - name: forgejo-persistent-storage
          nfs:
            server: 192.168.96.4
            path: /mnt/main/apps/forgejo
        - name: ssl-cert
          projected:
            sources:
              - secret:
                  name: internal-certificate-files
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  labels:
    app: forgejo
spec:
  type: LoadBalancer
  loadBalancerIP: ${LOAD_BALANCER_IP}
  ports:
    - port: 443
      protocol: TCP
      name: web
      targetPort: 3000
    - port: 22
      protocol: TCP
      name: ssh
      targetPort: 2222
  selector:
    app: forgejo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgejo-gitea-redirect
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://forgejo.internal.aleemhaji.com
spec:
  ingressClassName: nginx
  rules:
    - host: gitea
    - host: gitea.home
    - host: gitea.internal.aleemhaji.com
